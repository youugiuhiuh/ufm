name: Release Matrix Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Windows AMD64 -> MSI
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            os_kind: windows
          # Windows ARM64 -> MSI
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            os_kind: windows
          # Linux AMD64 -> DEB & RPM
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            os_kind: linux
          # Linux ARM64 -> DEB & RPM
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os_kind: linux
          # macOS Apple Silicon (ARM64) -> DMG
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os_kind: macos
          # macOS Intel (AMD64) -> DMG
          - name: macos-amd64
            os: macos-13
            target: x86_64-apple-darwin
            arch: amd64
            os_kind: macos

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          cd web
          bun install
          bun run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Linux 打包工具链安装
      - name: Install Linux Packaging Tools
        if: matrix.platform.os_kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev
          if [ "${{ matrix.platform.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Compile UFM Core Workspace
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p ufm-desktop --target ${{ matrix.platform.target }}

      # 1. Windows 原生 MSI 安装包构建
      - name: Build Windows MSI Installer
        if: matrix.platform.os_kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/msi-build
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          # 直接将编译出的二进制文件和模板复制到同级目录，消除反斜杠与相对路径查找问题
          cp "$TARGET_DIR/ufm.exe" dist/msi-build/ufm.exe
          cp packaging/windows/ufm.wxs dist/msi-build/ufm.wxs
          cd dist/msi-build
          candle -out ufm.wixobj ufm.wxs
          light -ext WixUIExtension -out "../ufm-${{ matrix.platform.name }}.msi" ufm.wixobj || {
            light -out "../ufm-${{ matrix.platform.name }}.msi" ufm.wixobj
          }

      # 2. Linux 原生 DEB & RPM 安装包构建
      - name: Build Linux DEB & RPM Packages
        if: matrix.platform.os_kind == 'linux'
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          ARCH="${{ matrix.platform.arch }}"
          DEB_ARCH="$ARCH"
          RPM_ARCH="$ARCH"
          if [ "$ARCH" = "arm64" ]; then
            DEB_ARCH="arm64"
            RPM_ARCH="aarch64"
          elif [ "$ARCH" = "amd64" ]; then
            DEB_ARCH="amd64"
            RPM_ARCH="x86_64"
          fi

          # 构建 DEB 包
          DEB_ROOT="dist/deb-root"
          mkdir -p "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/ufm" "$DEB_ROOT/DEBIAN"
          cp "$TARGET_DIR/ufm" "$DEB_ROOT/usr/bin/ufm"
          chmod 755 "$DEB_ROOT/usr/bin/ufm"
          cp -r web/dist "$DEB_ROOT/usr/share/ufm/web"

          echo "Package: ufm" > "$DEB_ROOT/DEBIAN/control"
          echo "Version: 0.1.0" >> "$DEB_ROOT/DEBIAN/control"
          echo "Section: utils" >> "$DEB_ROOT/DEBIAN/control"
          echo "Priority: optional" >> "$DEB_ROOT/DEBIAN/control"
          echo "Architecture: $DEB_ARCH" >> "$DEB_ROOT/DEBIAN/control"
          echo "Maintainer: UFM Team <ufm@example.com>" >> "$DEB_ROOT/DEBIAN/control"
          echo "Description: Unity Framework Manager" >> "$DEB_ROOT/DEBIAN/control"

          dpkg-deb --build "$DEB_ROOT" "dist/ufm-${{ matrix.platform.name }}.deb"

          # 构建 RPM 包 (在 x86_64 host 上交叉 target 到 aarch64 需要添加兼容平台支持)
          RPM_ROOT="$HOME/rpmbuild"
          mkdir -p "$RPM_ROOT/BUILD" "$RPM_ROOT/RPMS" "$RPM_ROOT/SOURCES" "$RPM_ROOT/SPECS" "$RPM_ROOT/SRPMS"
          mkdir -p "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/bin"
          mkdir -p "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/share/ufm"
          cp "$TARGET_DIR/ufm" "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/bin/ufm"
          chmod 755 "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/bin/ufm"
          cp -r web/dist "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/share/ufm/web"

          # 配置 rpm 宏
          rm -rf ~/.rpmmacros
          cat << EOF > ~/.rpmmacros
%_target_os linux
%_target_cpu $RPM_ARCH
EOF

          echo "Name: ufm" > "$RPM_ROOT/SPECS/ufm.spec"
          echo "Version: 0.1.0" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "Release: 1" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "Summary: Unity Framework Manager" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "License: MIT or Apache-2.0" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "BuildArch: $RPM_ARCH" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "%description" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "Unity Framework Manager" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "%files" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "/usr/bin/ufm" >> "$RPM_ROOT/SPECS/ufm.spec"
          echo "/usr/share/ufm/web" >> "$RPM_ROOT/SPECS/ufm.spec"

          # 如果 rpmbuild 无法直接为非本地 host 生成，则放行并降级为打包好的通用 linux-arm64
          rpmbuild -bb --target "$RPM_ARCH" "$RPM_ROOT/SPECS/ufm.spec" || {
            echo "::warning::rpmbuild aarch64 cross-packaging not supported on this host, skipping RPM generation"
          }
          cp "$RPM_ROOT/RPMS/$RPM_ARCH"/*.rpm "dist/ufm-${{ matrix.platform.name }}.rpm" 2>/dev/null || true

      # 3. macOS 原生 DMG 镜像构建
      - name: Build macOS DMG Package
        if: matrix.platform.os_kind == 'macos'
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          APP_DIR="dist/mac-app/Unity Framework Manager.app/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources/web"
          cp "$TARGET_DIR/ufm" "$APP_DIR/MacOS/ufm"
          chmod 755 "$APP_DIR/MacOS/ufm"
          cp -r web/dist "$APP_DIR/Resources/web"
          cp packaging/macos/Info.plist "$APP_DIR/Info.plist"

          DMG_STAGE="dist/dmg-stage"
          mkdir -p "$DMG_STAGE"
          cp -r "dist/mac-app/Unity Framework Manager.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Unity Framework Manager" -srcfolder "$DMG_STAGE" -ov -format UDZO "dist/ufm-${{ matrix.platform.name }}.dmg"

      - name: Upload Installer Packages
        uses: actions/upload-artifact@v4
        with:
          name: ufm-${{ matrix.platform.name }}
          path: |
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error

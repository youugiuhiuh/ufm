name: Release Matrix Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 跨平台多架构原生安装包构建矩阵
  build-matrix:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Windows AMD64 -> MSI 原生安装包
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            os_kind: windows
          # Windows ARM64 -> MSI 原生安装包
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            os_kind: windows
          # Linux AMD64 -> 原生二进制与打包
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            os_kind: linux
          # Linux ARM64 -> 交叉编译
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os_kind: linux
          # macOS Apple Silicon (ARM64)
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os_kind: macos
          # macOS Intel (AMD64)
          - name: macos-amd64
            os: macos-13
            target: x86_64-apple-darwin
            arch: amd64
            os_kind: macos

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          cd web
          bun install
          bun run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Windows WiX Toolset 安装 (生成 MSI 安装包必需)
      - name: Install WiX Toolset for MSI Packaging
        if: matrix.platform.os_kind == 'windows'
        shell: bash
        run: |
          echo "WiX Toolset is pre-installed on windows-latest runners"
          candle -? || true

      # Linux ARM64 交叉编译工具
      - name: Install Linux Cross Compiler
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compile UFM Core Workspace
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target ${{ matrix.platform.target }}

      # 针对 Windows 生成标准 MSI 安装程序 (采用 WiX)
      - name: Build Windows MSI Installer
        if: matrix.platform.os_kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/msi-build
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          
          # 编写 WiX 源码定义生成 MSI 安装包
          cat << 'EOF' > dist/msi-build/ufm.wxs
<?xml version="1.0" encoding="UTF-8"?>
<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
  <Product Id="*" Name="Unity Framework Manager" Language="2052" Version="0.1.0" Manufacturer="UFM Team" UpgradeCode="78f9c1b3-4f2a-4a89-9c56-d419b48f6820">
    <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
    <MajorUpgrade DowngradeErrorMessage="已安装更新版本的 Unity Framework Manager。" />
    <MediaTemplate EmbedCab="yes" />

    <Feature Id="ProductFeature" Title="Unity Framework Manager" Level="1">
      <ComponentGroupRef Id="ProductComponents" />
    </Feature>
  </Product>

  <Fragment>
    <Directory Id="TARGETDIR" Name="SourceDir">
      <Directory Id="ProgramFilesFolder">
        <Directory Id="INSTALLFOLDER" Name="Unity Framework Manager" />
      </Directory>
    </Directory>
  </Fragment>

  <Fragment>
    <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
      <Component Id="UfmExecutable" Guid="9b14c3e8-5b4d-4521-a3f1-e129cf9a38f4">
        <File Id="UfmExe" Source="target/release/ufm.exe" KeyPath="yes" />
      </Component>
    </ComponentGroup>
  </Fragment>
</Wix>
EOF

          # 修正二进制路径并调用 candle 与 light 生成原生 MSI
          sed -i "s|target/release/ufm.exe|$TARGET_DIR/ufm.exe|g" dist/msi-build/ufm.wxs
          candle -out dist/msi-build/ufm.wixobj dist/msi-build/ufm.wxs
          light -ext WixUIExtension -out "dist/ufm-${{ matrix.platform.name }}.msi" dist/msi-build/ufm.wixobj || {
            light -out "dist/ufm-${{ matrix.platform.name }}.msi" dist/msi-build/ufm.wixobj
          }
          echo "MSI 安装包生成完毕: dist/ufm-${{ matrix.platform.name }}.msi"

      # 针对 Linux / macOS 打包
      - name: Package Non-Windows Release Assets
        if: matrix.platform.os_kind != 'windows'
        shell: bash
        run: |
          DIST_DIR="dist/ufm-${{ matrix.platform.name }}"
          mkdir -p "$DIST_DIR"
          TARGET_DIR="target/${{ matrix.platform.target }}/release"

          cp "$TARGET_DIR/ufm" "$DIST_DIR/" 2>/dev/null || true
          cp -r web/dist "$DIST_DIR/web-ui"
          cd dist && tar -czvf "ufm-${{ matrix.platform.name }}.tar.gz" "ufm-${{ matrix.platform.name }}"

      - name: Upload Installer & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ufm-${{ matrix.platform.name }}
          path: |
            dist/*.msi
            dist/*.tar.gz
          if-no-files-found: error

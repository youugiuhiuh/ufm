name: Release Matrix Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 阶段 1：多架构多平台安装包矩阵构建
  build-matrix:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            os_kind: windows
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            os_kind: windows
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            os_kind: linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os_kind: linux
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os_kind: macos
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
            os_kind: macos

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies and Build Web UI
        run: |
          cd web
          bun install
          bun run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux Packaging Tools
        if: matrix.platform.os_kind == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq rpm dpkg-dev

      - name: Compile UFM Core Workspace
        run: cargo build --release -p ufm-desktop --target ${{ matrix.platform.target }}

      - name: Build Windows MSI Installer
        if: matrix.platform.os_kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/msi-build
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          cp "$TARGET_DIR/ufm.exe" dist/msi-build/ufm.exe
          cp packaging/windows/ufm.wxs dist/msi-build/ufm.wxs
          cp src-tauri/icons/icon.ico dist/msi-build/icon.ico
          cd dist/msi-build
          candle -out ufm.wixobj ufm.wxs
          light -ext WixUIExtension -out "../ufm-${{ matrix.platform.name }}.msi" ufm.wixobj || light -out "../ufm-${{ matrix.platform.name }}.msi" ufm.wixobj

      - name: Build Linux DEB and RPM Packages
        if: matrix.platform.os_kind == 'linux'
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          ARCH="${{ matrix.platform.arch }}"
          DEB_ARCH="$ARCH"
          RPM_ARCH="$ARCH"
          if [ "$ARCH" = "arm64" ]; then
            DEB_ARCH="arm64"
            RPM_ARCH="aarch64"
          elif [ "$ARCH" = "amd64" ]; then
            DEB_ARCH="amd64"
            RPM_ARCH="x86_64"
          fi

          DEB_ROOT="dist/deb-root"
          mkdir -p "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/ufm" "$DEB_ROOT/DEBIAN"
          cp "$TARGET_DIR/ufm" "$DEB_ROOT/usr/bin/ufm"
          chmod 755 "$DEB_ROOT/usr/bin/ufm"
          cp -r web/dist "$DEB_ROOT/usr/share/ufm/web"

          printf "Package: ufm\nVersion: 0.1.0\nSection: utils\nPriority: optional\nArchitecture: %s\nMaintainer: UFM Team <ufm@example.com>\nDescription: Unity Framework Manager\n" "$DEB_ARCH" > "$DEB_ROOT/DEBIAN/control"
          dpkg-deb --build "$DEB_ROOT" "dist/ufm-${{ matrix.platform.name }}.deb"

          RPM_ROOT="$HOME/rpmbuild"
          mkdir -p "$RPM_ROOT/BUILD" "$RPM_ROOT/RPMS" "$RPM_ROOT/SOURCES" "$RPM_ROOT/SPECS" "$RPM_ROOT/SRPMS"
          mkdir -p "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/bin"
          mkdir -p "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/share/ufm"
          cp "$TARGET_DIR/ufm" "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/bin/ufm"
          chmod 755 "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/bin/ufm"
          cp -r web/dist "$RPM_ROOT/BUILDROOT/ufm-0.1.0-1.$RPM_ARCH/usr/share/ufm/web"

          printf "Name: ufm\nVersion: 0.1.0\nRelease: 1\nBuildArch: %s\n" "$RPM_ARCH" > "$RPM_ROOT/SPECS/ufm.spec"
          cat packaging/linux/ufm.spec >> "$RPM_ROOT/SPECS/ufm.spec"

          rpmbuild -bb --target "$RPM_ARCH" "$RPM_ROOT/SPECS/ufm.spec" || true
          cp "$RPM_ROOT/RPMS/$RPM_ARCH"/*.rpm "dist/ufm-${{ matrix.platform.name }}.rpm" 2>/dev/null || true

      - name: Build macOS DMG Package
        if: matrix.platform.os_kind == 'macos'
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.platform.target }}/release"
          APP_DIR="dist/mac-app/Unity Framework Manager.app/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources/web"
          cp "$TARGET_DIR/ufm" "$APP_DIR/MacOS/ufm"
          chmod 755 "$APP_DIR/MacOS/ufm"
          cp -r web/dist "$APP_DIR/Resources/web"
          cp packaging/macos/Info.plist "$APP_DIR/Info.plist"
          cp src-tauri/icons/icon.icns "$APP_DIR/Resources/icon.icns" || true

          DMG_STAGE="dist/dmg-stage"
          mkdir -p "$DMG_STAGE"
          cp -r "dist/mac-app/Unity Framework Manager.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Unity Framework Manager" -srcfolder "$DMG_STAGE" -ov -format UDZO "dist/ufm-${{ matrix.platform.name }}.dmg"

      - name: Upload Installer Packages to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ufm-pkg-${{ matrix.platform.name }}
          path: |
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error

  # 阶段 2：发布到 GitHub Releases (参考规范)
  publish:
    name: Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Resolve Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/' || echo "0.1.0")
          fi
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize Release Files
        run: |
          mkdir -p release-dist
          find release-artifacts -type f \( -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \) -exec cp {} release-dist/ \;
          echo "=== 待发布的安装包列表 ==="
          ls -lh release-dist/

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="Unity Framework Manager $TAG"
          
          # 先清理已存在的同名 Release（幂等保护）
          gh release delete "$TAG" --yes 2>/dev/null || true
          
          # 创建 Release 并一次性上传全部原生安装包
          gh release create "$TAG" release-dist/* \
            --title "$TITLE" \
            --notes "Unity Framework Manager $TAG Release"


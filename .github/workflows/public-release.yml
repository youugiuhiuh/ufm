name: Release Matrix Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 统一矩阵交叉构建：覆盖 Linux/Windows/macOS 的 amd64 与 arm64 架构
  build-matrix:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux AMD64
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            os_kind: linux
          # Linux ARM64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os_kind: linux
          # Windows AMD64
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            os_kind: windows
          # Windows ARM64
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            os_kind: windows
          # macOS Apple Silicon (ARM64)
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os_kind: macos
          # macOS Intel (AMD64)
          - name: macos-amd64
            os: macos-13
            target: x86_64-apple-darwin
            arch: amd64
            os_kind: macos

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies & Build
        run: |
          cd web
          bun install
          bun run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Linux ARM64 交叉编译需要 aarch64-linux-gnu-gcc
      - name: Install Linux Cross Compiler
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compile UFM Core Workspace
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target ${{ matrix.platform.target }}

      - name: Package Release Assets
        shell: bash
        run: |
          DIST_DIR="dist/ufm-${{ matrix.platform.name }}"
          mkdir -p "$DIST_DIR"
          TARGET_DIR="target/${{ matrix.platform.target }}/release"

          if [ "${{ matrix.platform.os_kind }}" = "windows" ]; then
            cp "$TARGET_DIR/ufm.exe" "$DIST_DIR/" 2>/dev/null || true
            cp -r web/dist "$DIST_DIR/web-ui"
            cd dist && zip -r "ufm-${{ matrix.platform.name }}.zip" "ufm-${{ matrix.platform.name }}"
          else
            cp "$TARGET_DIR/ufm" "$DIST_DIR/" 2>/dev/null || true
            cp -r web/dist "$DIST_DIR/web-ui"
            cd dist && tar -czvf "ufm-${{ matrix.platform.name }}.tar.gz" "ufm-${{ matrix.platform.name }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufm-${{ matrix.platform.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
